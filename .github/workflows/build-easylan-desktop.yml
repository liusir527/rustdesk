name: Build EasyLAN Multiplatform

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  CARGO_NDK_VERSION: "3.1.2"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r27c"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.4.5"
  RUSTDESK_PRESET_FILE: ".github/presets/easylan.json"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    name: x86_64-pc-windows-msvc
    needs: [generate-bridge, build-RustDeskTempTopMostWindow]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load RustDesk preset config
        shell: pwsh
        run: |
          $preset = Get-Content "${{ env.RUSTDESK_PRESET_FILE }}" -Raw | ConvertFrom-Json
          $settings = @{
            RUSTDESK_PRESET_HARD_SETTINGS = $preset.hard_settings
            RUSTDESK_PRESET_OVERRIDE_SETTINGS = $preset.override_settings
            RUSTDESK_PRESET_BUILTIN_SETTINGS = $preset.builtin_settings
          }
          foreach ($item in $settings.GetEnumerator()) {
            $json = $item.Value | ConvertTo-Json -Compress -Depth 20
            Add-Content -Path $env:GITHUB_ENV -Value "$($item.Key)<<EOF"
            Add-Content -Path $env:GITHUB_ENV -Value $json
            Add-Content -Path $env:GITHUB_ENV -Value "EOF"
          }

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-easylan

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
            }
          } catch {
            Write-Host "Ignore the printer driver error."
          }

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ -n "$runner_res" ]; then
            cp "$runner_res" ./libs/portable/Runner.res
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        with:
          name: topmostwindow-artifacts
          path: ./rustdesk

      - name: Upload unpacked artifact
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-easylan-unsigned-windows-x64
          path: rustdesk

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-easylan-${{ env.VERSION }}-x64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-easylan-${{ env.VERSION }}-x64.msi
          sha256sum ../../SignOutput/rustdesk-easylan-*.msi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-easylan-installers-windows-x64
          path: SignOutput

  build-macos:
    name: macOS ${{ matrix.job.arch }}
    needs: [generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              arch: x86_64,
              extra-build-args: "",
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              arch: aarch64,
              extra-build-args: "--screencapturekit",
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load RustDesk preset config
        shell: pwsh
        run: |
          $preset = Get-Content "${{ env.RUSTDESK_PRESET_FILE }}" -Raw | ConvertFrom-Json
          $settings = @{
            RUSTDESK_PRESET_HARD_SETTINGS = $preset.hard_settings
            RUSTDESK_PRESET_OVERRIDE_SETTINGS = $preset.override_settings
            RUSTDESK_PRESET_BUILTIN_SETTINGS = $preset.builtin_settings
          }
          foreach ($item in $settings.GetEnumerator()) {
            $json = $item.Value | ConvertTo-Json -Compress -Depth 20
            Add-Content -Path $env:GITHUB_ENV -Value "$($item.Key)<<EOF"
            Add-Content -Path $env:GITHUB_ENV -Value $json
            Add-Content -Path $env:GITHUB_ENV -Value "EOF"
          }

      - name: Install build runtime
        shell: bash
        run: |
          brew install llvm create-dmg
          if ! command -v pkg-config &>/dev/null; then
            brew install pkg-config
          fi

      - name: Install NASM
        shell: bash
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        shell: bash
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}-easylan

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Build rustdesk
        shell: bash
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Create unsigned dmg
        shell: bash
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-easylan-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app

      - name: Upload macOS dmg
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-easylan-macos-${{ matrix.job.arch }}
          path: rustdesk-easylan-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg

  build-linux:
    name: Linux x86_64 deb/rpm
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        shell: bash
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm qemu-user-static

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load RustDesk preset config
        shell: pwsh
        run: |
          $preset = Get-Content "${{ env.RUSTDESK_PRESET_FILE }}" -Raw | ConvertFrom-Json
          $settings = @{
            RUSTDESK_PRESET_HARD_SETTINGS = $preset.hard_settings
            RUSTDESK_PRESET_OVERRIDE_SETTINGS = $preset.override_settings
            RUSTDESK_PRESET_BUILTIN_SETTINGS = $preset.builtin_settings
          }
          foreach ($item in $settings.GetEnumerator()) {
            $json = $item.Value | ConvertTo-Json -Compress -Depth 20
            Add-Content -Path $env:GITHUB_ENV -Value "$($item.Key)<<EOF"
            Add-Content -Path $env:GITHUB_ENV -Value $json
            Add-Content -Path $env:GITHUB_ENV -Value "EOF"
          }

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Save Rust toolchain version
        shell: bash
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> "$GITHUB_ENV"

      - name: Disable rust bridge build
        shell: bash
        run: |
          sed -i 's/\["cdylib", "staticlib", "rlib"\]/\["cdylib"\]/g' Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          sudo apt install -y libva-dev
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Build rustdesk deb/rpm
        uses: rustdesk-org/run-on-arch-action@amd64-support
        with:
          arch: x86_64
          distro: ubuntu18.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
            --env RUSTDESK_PRESET_HARD_SETTINGS
            --env RUSTDESK_PRESET_OVERRIDE_SETTINGS
            --env RUSTDESK_PRESET_BUILTIN_SETTINGS
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y \
              build-essential \
              clang \
              cmake \
              curl \
              gcc \
              git \
              g++ \
              libayatana-appindicator3-dev \
              libasound2-dev \
              libclang-10-dev \
              libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev \
              libgtk-3-dev \
              libpam0g-dev \
              libpulse-dev \
              libva-dev \
              libxcb-randr0-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev \
              libxdo-dev \
              libxfixes-dev \
              llvm-10-dev \
              nasm \
              ninja-build \
              pkg-config \
              python3 \
              rpm \
              unzip \
              wget \
              xz-utils \
              libssl-dev
            apt-get remove -y libopus-dev || true
          run: |
            git config --global --add safe.directory "*"
            pushd /opt
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu.tar.gz
            tar -zxvf rust.tar.gz > /dev/null
            rm rust.tar.gz
            cd rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu
            ./install.sh
            rm -rf rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu

            mkdir -p ~/.cargo/
            echo "[source.crates-io]" > ~/.cargo/config
            echo "registry = 'https://github.com/rust-lang/crates.io-index'" >> ~/.cargo/config

            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            cargo build --lib --features hwcodec,flutter,unix-file-copy-paste --release
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo

            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            export PATH=/opt/flutter/bin:$PATH
            flutter doctor -v

            if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
              pushd /opt/flutter
              git apply /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
              popd
            fi

            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=amd64
            python3 ./build.py --flutter --skip-cargo
            for name in rustdesk*??.deb; do
              mv "$name" "${name%%.deb}-x86_64.deb"
            done

            HBB=$(pwd) rpmbuild ./res/rpm-flutter.spec -bb
            pushd ~/rpmbuild/RPMS/x86_64
            for name in rustdesk*??.rpm; do
              mv "$name" /workspace/"${name%%.rpm}.rpm"
            done

            pushd /workspace
            HBB=$(pwd) rpmbuild ./res/rpm-flutter-suse.spec -bb
            pushd ~/rpmbuild/RPMS/x86_64
            for name in rustdesk*??.rpm; do
              mv "$name" /workspace/"${name%%.rpm}-suse.rpm"
            done

      - name: Upload Linux packages
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-easylan-linux-x86_64
          path: |
            rustdesk-*.deb
            rustdesk-*.rpm

  build-android-unsigned:
    name: Android unsigned APK ${{ matrix.job.arch }}
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-linux-android,
              android-target: arm64-v8a,
              flutter-target: android-arm64,
              apk-name: app-arm64-v8a-release.apk,
              ndk-lib-dir: aarch64-linux-android,
              jni-dir: arm64-v8a,
              ndk-script: ndk_arm64.sh,
            }
          - {
              arch: armv7,
              target: armv7-linux-androideabi,
              android-target: armeabi-v7a,
              flutter-target: android-arm,
              apk-name: app-armeabi-v7a-release.apk,
              ndk-lib-dir: arm-linux-androideabi,
              jni-dir: armeabi-v7a,
              ndk-script: ndk_arm.sh,
            }
          - {
              arch: x86_64,
              target: x86_64-linux-android,
              android-target: x86_64,
              flutter-target: android-x64,
              apk-name: app-x86_64-release.apk,
              ndk-lib-dir: x86_64-linux-android,
              jni-dir: x86_64,
              ndk-script: ndk_x64.sh,
            }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc-multilib \
            git \
            g++ \
            g++-multilib \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libc6-dev \
            libclang-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpam0g-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm-dev \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            tree \
            wget

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load RustDesk preset config
        shell: pwsh
        run: |
          $preset = Get-Content "${{ env.RUSTDESK_PRESET_FILE }}" -Raw | ConvertFrom-Json
          $settings = @{
            RUSTDESK_PRESET_HARD_SETTINGS = $preset.hard_settings
            RUSTDESK_PRESET_OVERRIDE_SETTINGS = $preset.override_settings
            RUSTDESK_PRESET_BUILTIN_SETTINGS = $preset.builtin_settings
          }
          foreach ($item in $settings.GetEnumerator()) {
            $json = $item.Value | ConvertTo-Json -Compress -Depth 20
            Add-Content -Path $env:GITHUB_ENV -Value "$($item.Key)<<EOF"
            Add-Content -Path $env:GITHUB_ENV -Value $json
            Add-Content -Path $env:GITHUB_ENV -Value "EOF"
          }

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        shell: bash
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.android-target }}"; then
            find "$VCPKG_ROOT/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-lib-cache-android-easylan
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          rustup target add "${{ matrix.job.target }}"
          cargo install cargo-ndk --version "${{ env.CARGO_NDK_VERSION }}" --locked
          "./flutter/${{ matrix.job.ndk-script }}"
          mkdir -p "./flutter/android/app/src/main/jniLibs/${{ matrix.job.jni-dir }}"
          cp "./target/${{ matrix.job.target }}/release/liblibrustdesk.so" "./flutter/android/app/src/main/jniLibs/${{ matrix.job.jni-dir }}/librustdesk.so"

      - name: Build unsigned apk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        shell: bash
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          mkdir -p "./flutter/android/app/src/main/jniLibs/${{ matrix.job.jni-dir }}"
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.ndk-lib-dir }}/libc++_shared.so" "./flutter/android/app/src/main/jniLibs/${{ matrix.job.jni-dir }}/"
          cp "./target/${{ matrix.job.target }}/release/liblibrustdesk.so" "./flutter/android/app/src/main/jniLibs/${{ matrix.job.jni-dir }}/librustdesk.so"
          pushd flutter
          flutter build apk --release --target-platform "${{ matrix.job.flutter-target }}" --split-per-abi
          popd
          mkdir -p android-apk
          mv "./flutter/build/app/outputs/flutter-apk/${{ matrix.job.apk-name }}" "./android-apk/rustdesk-easylan-${{ env.VERSION }}-${{ matrix.job.arch }}-unsigned.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-easylan-android-${{ matrix.job.arch }}-unsigned
          path: android-apk/*.apk
